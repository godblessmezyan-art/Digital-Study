<!DOCTYPE html>
<html lang="zh-CN" data-theme="fresh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字书房 · 安静阅读，慢下来</title>
  <meta name="description" content="一个治愈、安静、自然的数字书房。每天留一点时间，给阅读和自己。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />

  <!-- 主题变量（独立文件，方便未来扩展深色夜读 / 蓝色梦幻 / 复古纸张等主题） -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- 整个页面是一间书房：窗、植物、木书架、木桌等环境全部来自同一张场景图 -->
  <div class="room" aria-hidden="true"></div>

  <!-- 顶部导航 -->
  <header class="top-nav" id="top-nav"></header>

  <div class="app">
    <!-- 左侧导航 -->
    <aside class="side-nav" id="side-nav"></aside>

    <!-- 主内容区：由 JS 组件依次挂载 -->
    <main class="page" id="page"></main>
  </div>

  <!-- 页脚 -->
  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>

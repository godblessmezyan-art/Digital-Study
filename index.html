<!doctype html>
<html lang="zh-CN" data-theme="cloud-realm">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="云天幻境——漂浮在云海与天空城之间的西方奇幻数字书房。" />
  <meta name="theme-color" content="#14283f" />
  <title>云天幻境 · 数字书房</title>
  <link rel="stylesheet" href="css/variables.css?v=cloud-realm-study-23" />
  <link rel="stylesheet" href="css/base.css?v=cloud-realm-study-23" />
  <link rel="stylesheet" href="css/layout.css?v=cloud-realm-study-23" />
  <link rel="stylesheet" href="css/components.css?v=cloud-realm-study-23" />
</head>
<body>
  <div class="world" aria-hidden="true">
    <img class="world__art" src="assets/cloud-realm-study-v2.png" alt="" />
    <div class="world__veil"></div>
  </div>

  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar" id="topbar"></header>
  <main class="main" id="app"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <aside class="scene-caption" id="scene-caption" aria-live="polite"></aside>
  <div class="scenic-controls" id="scenic-controls" aria-label="观景模式控制">
    <button type="button" id="scenic-prev" aria-label="切换上一处风景"></button>
    <button type="button" id="scenic-next" aria-label="切换下一处风景"></button>
    <button type="button" id="scenic-return" aria-label="返回数字书房"></button>
  </div>

  <script type="module" src="js/main.js?v=cloud-realm-study-23"></script>
</body>
</html>

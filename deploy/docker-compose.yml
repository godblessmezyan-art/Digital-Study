services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digital_study}
      MYSQL_USER: ${MYSQL_USER:-digital_study}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-digital_study}:${MYSQL_PASSWORD:-change-me}@db:3306/${MYSQL_DATABASE:-digital_study}
      API_PORT: 3000
      CONTENT_ROOT: /data/books
      CONTENT_TRASH_ROOT: /data/trash/books
      GIT_REPOSITORY_ROOT: /git-repository
      GIT_CONTENT_ROOT: /git-repository/content/books
      GIT_CONTENT_BRANCH: ${GIT_CONTENT_BRANCH:-content}
      GIT_PUSH_ENABLED: ${GIT_PUSH_ENABLED:-true}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Digital Study}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-digital-study@localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-1}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
      STUDY_AUTH_BASE_URL: ${STUDY_AUTH_BASE_URL:-https://wxhappylife.top/study/api/auth}
      AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:-}
    volumes:
      - ../runtime-data/books:/data/books
      - ../runtime-data/trash:/data/trash
      - ../git-mirror:/git-repository
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ../runtime-data/books:/srv/content/books:ro
    depends_on:
      - api

volumes:
  mysql_data:

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    container_name: digital-study-api
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      API_PORT: 3000
      CONTENT_ROOT: /data/books
      CONTENT_TRASH_ROOT: /data/trash/books
      TEMPLATES_ROOT: /data/templates
      GIT_REPOSITORY_ROOT: /git-repository
      GIT_CONTENT_ROOT: /git-repository/content/books
      GIT_CONTENT_BRANCH: ${GIT_CONTENT_BRANCH:-content}
      GIT_PUSH_ENABLED: ${GIT_PUSH_ENABLED:-true}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Digital Study}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-digital-study@localhost}
    volumes:
      - ../runtime-data/books:/data/books
      - ../runtime-data/trash:/data/trash
      - ../runtime-data/templates:/data/templates
      - ../git-mirror:/git-repository
    networks:
      - default
      - onepanel
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    container_name: digital-study-web
    restart: unless-stopped
    ports:
      - 127.0.0.1:8780:80
    volumes:
      - ../runtime-data/books:/srv/content/books:ro
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  onepanel:
    external: true
    name: 1panel-network

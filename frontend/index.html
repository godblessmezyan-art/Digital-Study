<!DOCTYPE html>
<html lang="zh-CN" data-theme="fresh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字书房 · 安静阅读，慢下来</title>
  <meta name="description" content="一个治愈、安静、自然的数字书房。每天留一点时间，给阅读和自己。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />

  <!-- 主题变量（独立文件，方便未来扩展深色夜读 / 蓝色梦幻 / 复古纸张等主题） -->
  <link rel="stylesheet" href="/src/css/variables.css" />
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/layout.css" />
  <link rel="stylesheet" href="/src/css/components.css" />
</head>
<body>
  <!-- 整个页面是一间书房：墙面、窗、光线、远处书架、地板是连续的环境层 -->
  <div class="room" aria-hidden="true">
    <!-- 从窗口斜进来的午后光线 -->
    <div class="room__light"></div>

    <!-- 左墙的窗：Hero 就是窗边的阅读角 -->
    <div class="room__window">
      <div class="room__sill"></div>
      <svg class="room__sill-plant" viewBox="0 0 60 66">
        <g class="leaf">
          <path d="M30 46 C 28 30, 18 22, 10 19 C 22 20, 29 30, 30 46 Z" opacity="0.9"/>
          <path d="M31 46 C 32 28, 40 20, 50 17 C 40 23, 33 32, 31 46 Z" opacity="0.85"/>
          <path d="M30 46 C 30 28, 28 16, 27 6 C 34 18, 32 34, 30 46 Z"/>
        </g>
        <path class="pot" d="M20 46 h20 l-3 14 H23 Z"/>
      </svg>
    </div>

    <!-- 右墙深处书墙：全页唯一暗部（雾蓝灰），房间深处背光的一面书墙 -->
    <svg class="room__shelf" viewBox="0 0 340 240" fill="none">
      <!-- 两层架板 -->
      <rect x="8" y="70" width="324" height="5" rx="2" fill="currentColor" opacity="0.55"/>
      <rect x="8" y="166" width="324" height="5" rx="2" fill="currentColor" opacity="0.55"/>
      <!-- 上层书 -->
      <rect x="32" y="28" width="16" height="42" fill="currentColor" opacity="0.75"/>
      <rect x="52" y="22" width="14" height="48" fill="currentColor" opacity="0.6"/>
      <rect x="70" y="34" width="18" height="36" fill="currentColor" opacity="0.8"/>
      <path d="M104 70 l12 -46 l15 4 z" fill="currentColor" opacity="0.65"/>
      <rect x="150" y="30" width="14" height="40" fill="currentColor" opacity="0.55"/>
      <rect x="170" y="24" width="12" height="46" fill="currentColor" opacity="0.7"/>
      <rect x="210" y="26" width="16" height="44" fill="currentColor" opacity="0.7"/>
      <rect x="230" y="32" width="18" height="38" fill="currentColor" opacity="0.6"/>
      <rect x="256" y="38" width="12" height="32" fill="currentColor" opacity="0.75"/>
      <!-- 下层书 -->
      <rect x="32" y="122" width="14" height="44" fill="currentColor" opacity="0.65"/>
      <rect x="52" y="130" width="18" height="36" fill="currentColor" opacity="0.55"/>
      <rect x="80" y="124" width="14" height="42" fill="currentColor" opacity="0.7"/>
      <rect x="104" y="132" width="16" height="34" fill="currentColor" opacity="0.6"/>
      <rect x="150" y="118" width="16" height="48" fill="currentColor" opacity="0.7"/>
      <rect x="170" y="126" width="20" height="40" fill="currentColor" opacity="0.6"/>
      <rect x="194" y="114" width="14" height="52" fill="currentColor" opacity="0.8"/>
      <rect x="216" y="122" width="16" height="44" fill="currentColor" opacity="0.55"/>
      <rect x="240" y="130" width="14" height="36" fill="currentColor" opacity="0.7"/>
      <rect x="262" y="118" width="16" height="48" fill="currentColor" opacity="0.65"/>
    </svg>

    <!-- 地板与地毯 -->
    <div class="room__floor"></div>
    <div class="room__rug"></div>
  </div>

  <!-- 顶部导航 -->
  <header class="top-nav" id="top-nav"></header>

  <div class="app">
    <!-- 左侧导航 -->
    <aside class="side-nav" id="side-nav"></aside>

    <!-- 主内容区：由 JS 组件依次挂载 -->
    <main class="page" id="page"></main>
  </div>

  <!-- 页脚 -->
  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

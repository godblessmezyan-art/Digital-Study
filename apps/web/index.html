<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c1c2b">
  <meta name="description" content="云天幻境 · 藏书管理与 AI 内容工坊">
  <title>云天幻境 · 内容管理</title>
  <link rel="stylesheet" href="css/app.css?v=1">
  <link rel="stylesheet" href="css/categories.css?v=1">
  <link rel="stylesheet" href="css/studio-v2.css?v=1">
  <link rel="stylesheet" href="css/studio-workshop.css?v=2">
  <link rel="stylesheet" href="css/shared-shell.css?v=1">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <header class="app-topbar" id="appTopbar"></header>
  <header class="mobilebar">
    <button class="icon-button" id="menuButton" aria-label="打开菜单">☰</button>
    <span>云天幻境</span>
    <button class="icon-button" aria-label="通知">♧</button>
  </header>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <aside class="app-scene-caption" id="appSceneCaption" aria-live="polite"></aside>
  <div class="app-scenic-controls" id="appScenicControls">
    <button type="button" id="appScenePrev" aria-label="上一处风景"></button>
    <button type="button" id="appSceneNext" aria-label="下一处风景"></button>
    <button type="button" id="appSceneReturn" aria-label="返回工作区"></button>
  </div>
  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>

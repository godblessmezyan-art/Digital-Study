<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" role="img" aria-label="云海之上的西方奇幻天空城与飞艇">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#76b9eb"/><stop offset=".52" stop-color="#d6ecfa"/><stop offset="1" stop-color="#fff4dc"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fffbe7" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="rock" x2=".7" y2="1"><stop stop-color="#b7a883"/><stop offset=".45" stop-color="#746e68"/><stop offset="1" stop-color="#344352"/></linearGradient>
    <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#fff7df"/><stop offset="1" stop-color="#aab4ba"/></linearGradient>
    <linearGradient id="navy" x2=".2" y2="1"><stop stop-color="#203d5b"/><stop offset="1" stop-color="#08192b"/></linearGradient>
    <linearGradient id="sail" x2="1" y2="1"><stop stop-color="#fff7df"/><stop offset=".55" stop-color="#dcc9a2"/><stop offset="1" stop-color="#aa895e"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#38536b" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1800" height="1000" fill="url(#sky)"/>
  <circle cx="670" cy="115" r="290" fill="url(#sun)"/>
  <g fill="#fff" opacity=".56" filter="url(#blur)">
    <ellipse cx="370" cy="580" rx="430" ry="110"/><ellipse cx="990" cy="620" rx="520" ry="125"/><ellipse cx="1580" cy="555" rx="390" ry="100"/>
    <ellipse cx="780" cy="860" rx="700" ry="150"/><ellipse cx="1650" cy="830" rx="430" ry="120"/>
  </g>
  <g opacity=".42" fill="#768da0">
    <path d="M460 290l52 9-19 28-12 62-20-62-31-27z"/><path d="M1535 265l48 8-12 25-20 66-22-62-27-29z"/><path d="M680 355l40 7-12 20-15 50-18-47-22-23z"/>
  </g>
  <!-- distant bridges -->
  <g fill="none" stroke="#d8d9d4" stroke-width="10" opacity=".7">
    <path d="M725 445 Q885 360 1055 430"/><path d="M1255 410 Q1435 315 1610 390"/>
  </g>
  <g fill="none" stroke="#929ea7" stroke-width="3" opacity=".6">
    <path d="M742 443v45m45-73v49m49-72v48m50-60v48m50-44v42m50-29v34"/>
  </g>
  <!-- main floating island -->
  <g filter="url(#soft)">
    <path d="M1010 470c90-30 235-27 345 10l-37 75-65 132-55 128-44-97-42-109-69-62z" fill="url(#rock)"/>
    <path d="M1000 470q180-60 365 7l-19 38q-176 46-347-2z" fill="#6e8b57"/>
    <path d="M1088 505v236" stroke="#dff5ff" stroke-width="13" opacity=".78"/><path d="M1292 510v148" stroke="#edfaff" stroke-width="9" opacity=".78"/>
    <path d="M1078 718l12 62 12-62m181-82l10 58 10-58" fill="#dff5ff" opacity=".6"/>
  </g>
  <!-- castle -->
  <g fill="url(#stone)" stroke="#718394" stroke-width="2" filter="url(#soft)">
    <path d="M1060 463V298h70v165z"/><path d="M1141 463V230h76v233z"/><path d="M1229 463V276h72v187z"/><path d="M1310 476V330h55v146z"/>
    <path d="M1052 298l43-78 43 78z" fill="#416486"/><path d="M1132 230l47-104 47 104z" fill="#31587c"/><path d="M1220 276l45-87 45 87z" fill="#3d6284"/><path d="M1303 330l35-68 35 68z" fill="#416486"/>
    <path d="M1104 471V350h142v121z"/><path d="M1068 356h286v23h-286z"/>
  </g>
  <g fill="#416486">
    <path d="M1087 330h15v35h-15zm82-54h18v48h-18zm75 40h15v40h-15zm85 49h12v33h-12z"/>
    <path d="M1128 408h24v62h-24zm65 0h24v62h-24zm65 0h24v62h-24z"/>
  </g>
  <g stroke="#ba8d4d" stroke-width="3"><path d="M1179 127v-28"/><path d="M1095 220v-22"/><path d="M1265 188v-22"/></g>
  <!-- foreground airship -->
  <g transform="translate(320 205) rotate(-5)" filter="url(#soft)">
    <path d="M-80 10C-12-64 195-58 266 18 190 91-11 89-80 10z" fill="url(#sail)" stroke="#9c7446" stroke-width="4"/>
    <path d="M-57 11h300M5-31C24 13 22 50 4 69M90-49c18 39 20 89 2 129m82-116c17 34 16 72 0 105" fill="none" stroke="#b49263" stroke-width="3" opacity=".75"/>
    <path d="M65 94h112l-12 40H84z" fill="#60452f" stroke="#c39756" stroke-width="4"/>
    <path d="M43 68l36 31m106-29l-17 30M-76 10l-41-6 35-14" fill="none" stroke="#735335" stroke-width="4"/>
    <path d="M112 94v38m-21-38l21-35 25 35" fill="none" stroke="#735335" stroke-width="3"/>
  </g>
  <!-- atmospheric cloud bands -->
  <g fill="#fff" opacity=".75">
    <ellipse cx="200" cy="625" rx="310" ry="88"/><ellipse cx="530" cy="675" rx="330" ry="100"/><ellipse cx="935" cy="650" rx="260" ry="72"/><ellipse cx="1535" cy="665" rx="410" ry="120"/>
  </g>
  <!-- architectural foreground -->
  <path d="M0 0h190v1000H0zM190 0h165q-110 160-122 353v647h-43z" fill="url(#navy)" opacity=".97"/>
  <path d="M1800 0h-170v1000h170zM1630 0h-150q98 145 113 340v660h37z" fill="url(#navy)" opacity=".9"/>
  <g stroke="#c99d59" fill="none" opacity=".8"><path d="M86 48v122M31 109h110"/><circle cx="86" cy="109" r="39"/><path d="M58 81l56 56m0-56l-56 56"/></g>
  <g fill="#8f6c41" opacity=".75"><rect x="1545" y="420" width="255" height="20"/><rect x="1560" y="455" width="220" height="16"/><rect x="1580" y="487" width="210" height="18"/></g>
  <g stroke="#9b7748" stroke-width="8" fill="none" opacity=".85"><path d="M1530 480l95-93"/><circle cx="1640" cy="372" r="22"/><path d="M1622 357l49-46"/></g>
  <g fill="#3e674d" opacity=".85"><path d="M185 20q55 62 5 138-45-62-5-138z"/><path d="M233 72q66 35 40 99-60-31-40-99z"/><path d="M155 95q-53 42-23 96 49-38 23-96z"/></g>
  <path d="M0 865q370-60 650 16t615-3q290-70 535 0v122H0z" fill="#f5ead7" opacity=".72"/>
</svg>
